# =====================================================================
#  실제 홈페이지(labhomepage.github.io/sassl)를 빌드해서 배포하는 워크플로
# ---------------------------------------------------------------------
#  실행되는 경우
#   ① main에 직접 수정(커밋)했을 때            → 바로 배포 (기존과 동일)
#   ② 논문 자동갱신(on-push / on-schedule) 종료 → 갱신된 논문목록으로 한 번 더 배포
#   ③ Actions 탭 → 이 워크플로 → [Run workflow] → 수동 배포
# =====================================================================
name: Build and Deploy to GitHub Pages

on:
  # ① main에 수정이 올라오면 실행
  push:
    branches:
      - main

  # ② 논문 자동갱신 워크플로가 끝나면 실행
  #    (자동갱신 봇의 커밋은 ①을 다시 실행시키지 못해서 따로 연결해 둠)
  workflow_run:
    workflows:
      - on-push
      - on-schedule
    types:
      - completed

  # ③ 수동 실행 버튼
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 하나씩 순서대로 처리 (대기 중이던 예전 것은 자동 취소 → 정상)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 항상 main의 "최신" 상태로 빌드 (방금 자동 커밋된 논문목록까지 포함)
          ref: main

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build site
        run: bundle exec jekyll build -d _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
